# Minimal keyless composition: real app, pwsh executor, and pwsh tool; replayed model.
- id: llm-deepseek
  name: '@forwork/llm-deepseek-api-key'
  disabled: true

- insert:
    - id: llm-replay
      name: '@forwork/llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-pro

- id: subprocess
  name: '@forwork/subprocess-local'

- id: bash-sandbox
  name: '@forwork/bash-sandbox'
  disabled: true

- id: pwsh-sandbox
  name: '@forwork/pwsh-sandbox'
  disabled: false

- id: shell-env
  name: '@forwork/shell-env'

- id: agent-default-model
  name: '@forwork/agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro

- id: session-persistence-jsonl
  name: '@forwork/session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- id: agent-instructions
  name: '@forwork/agent-instructions'
  disabled: true

- id: system-prompt
  name: '@forwork/system-prompt'
  config:
    personaPrefix: You are a concise snapshot agent.

- id: goal
  name: '@forwork/goal'
  disabled: true

- id: goal-round-driver
  name: '@forwork/goal-round-driver'
  disabled: true

- id: command-goal
  name: '@forwork/command-goal'
  disabled: true

- id: tool-goal
  name: '@forwork/tool-goal'
  disabled: true

- id: skill
  name: '@forwork/skill'
  disabled: true

- id: skill-filesystem
  name: '@forwork/skill-filesystem'
  disabled: true

- id: tool-skill
  name: '@forwork/tool-skill'
  disabled: true

- id: tool-bash
  name: '@forwork/tool-bash'
  disabled: true

- id: tool-pwsh
  name: '@forwork/tool-pwsh'
  disabled: false
