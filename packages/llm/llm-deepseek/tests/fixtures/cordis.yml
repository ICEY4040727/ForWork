- name: '@forwork/llm'
- name: '@forwork/session'
- name: '@forwork/session-projection'
- name: '@forwork/system-prompt'
- name: '@forwork/tools'
- name: '@forwork/tool-executor-native'
- name: '@forwork/agent'
- name: '@forwork/agent-loop'
  config:
    agents: []
- name: '@forwork/credentials-local'
  config:
    path: {{credentials}}
    watch: false
- name: '@forwork/llm-deepseek-api-key'
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    baseURL: {{endpoint}}
    thinking: enabled
    reasoningEffort: high
    maxTokens: 256000
    streamIdleTimeoutMs: 300000
- name: '@forwork/llm-deepseek-account'
  config:
    baseURL: {{endpoint}}
